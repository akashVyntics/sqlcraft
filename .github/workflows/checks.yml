name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.in
      - name: Check application configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run authentication, isolation and SQL tests
        run: python manage.py test practice
      - name: Check question content
        run: python verify_offline.py
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Verify production configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-configuration-check-key-never-for-production-9fd733e8c201"
          EMAIL_HOST: "smtp.example.invalid"
          DEFAULT_FROM_EMAIL: "noreply@example.invalid"
          DJANGO_ALLOWED_HOSTS: "sqlcraft.example.invalid"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build static assets
        run: python manage.py collectstatic --noinput
