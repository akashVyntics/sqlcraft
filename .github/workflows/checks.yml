name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Check application configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Build static assets before rendering tests
        run: python manage.py collectstatic --noinput
      - name: Run authentication, isolation and SQL tests
        run: python manage.py test practice
      - name: Check question content
        run: python verify_offline.py
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Verify production configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-configuration-check-key-never-for-production-9fd733e8c201"
          EMAIL_HOST: "smtp.example.invalid"
          DEFAULT_FROM_EMAIL: "noreply@example.invalid"
          DJANGO_ALLOWED_HOSTS: "sqlcraft.example.invalid"
        run: python manage.py check --deploy --fail-level WARNING
