{% extends 'account/base.html' %}
{% block auth_content %}<h2>Choose a new password</h2>{% if token_fail %}<p>This reset link is invalid or expired.</p><a href="{% url 'account_reset_password' %}">Request another link</a>{% else %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="button primary full">Set new password</button></form>{% endif %}{% endblock %}
